<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar Venta</title>
    <link rel="stylesheet" href="./css/addsale.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head> 
<body>
    <div class="card add">
        <div class="card-body">
            <h5 class="card-title">Agregar Venta</h5>
            <div class="form-group mt-4">
                <label for="input-cod">Código</label>
                <input type="text" class="form-control" id="input-cod">
            </div>
            <div class="form-group">
                <label for="input-cod-ceramic">Ceramica</label>
                <input type="text" class="form-control" id="input-cod-ceramic">
            </div>
            <div class="form-group">
                <label for="input-payment">Metodo de Pago</label>
                <input type="text" class="form-control" id="input-payment">
            </div>
            <div class="form-group">
                <label for="input-priceSale">Precio</label>
                <input type="text" class="form-control" id="input-priceSale">
            </div>
            <div class="form-group">
                <label for="input-quantitySold">Cantidad</label>
                <input type="text" class="form-control" id="input-quantitySold">
            </div>
            
            <div class="form-group mt-3">
                <button type="button" class="btn btn-primary" id="button-create">Añadir</button>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/addsale.js"></script>
</body>
</html>
