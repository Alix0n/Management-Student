<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar Cerámica</title>
    <link rel="stylesheet" href="./css/addceramic.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head>
<body>
    <div class="card add">
        <div class="card-body">
            <h5 class="card-title">Agregar Cerámica</h5>
            <div class="form-group mt-4">
                <label for="input-code">Código</label>
                <input type="text" class="form-control" id="input-code">
            </div>
            <div class="form-group">
                <label for="input-material">Material</label>
                <input type="text" class="form-control" id="input-material">
            </div>
            <div class="form-group">
                <label for="input-color">Color</label>
                <input type="text" class="form-control" id="input-color">
            </div>
            <div class="form-group">
                <label for="input-form">Forma</label>
                <input type="text" class="form-control" id="input-form">
            </div>
            <div class="form-group">
                <label for="input-acabado">Acabado</label>
                <input type="text" class="form-control" id="input-acabado">
            </div>
            <div class="form-group">
                <label for="input-price">Precio</label>
                <input type="text" class="form-control" id="input-price">
            </div>
            <div class="form-group">
                <label for="input-stock">Stock</label>
                <input type="text" class="form-control" id="input-stock">
            </div>
            <div class="form-group mt-3">
                <button type="button" class="btn btn-primary" id="button-create">Agregar</button>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/addceramic.js"></script>
</body>
</html>
