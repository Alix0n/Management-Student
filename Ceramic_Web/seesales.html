<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar Venta</title>
    <link rel="stylesheet" href="css/seesales.css">
</head>
<body>
    <div class="query-container">
        <h2>Consultar Venta</h2>
        <form id="querySaleForm">
            <div class="query-row">
                <label for="query-code">Código de la Venta:</label>
                <input type="text" id="query-code" name="query-code" required>
            </div>
            <div class="query-row">
                <button type="submit">Consultar</button>
            </div>
        </form>
        <div class="result-container">
            <h3>Resultados de la Consulta:</h3>
            <div id="result">
            </div>
        </div>
    </div>
    <script src="js/seesales.js"></script>
</body>
</html>
