<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actualizar Venta</title>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/updateuser.css">
</head>
<body>
    <div class="card add">
        <div class="card-body">
            <h5 class="card-title">Actualizar Usuario</h5>
            <form class="row g-3">
                <div class="col-md-6">
                    <label for="input-code" class="form-label">Usuario</label>
                    <input type="text" class="form-control" id="input-code">
                </div>
                <div class="col-md-6">
                    <label for="input-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="input-password">
                </div>
                
                
                <div class="col-12">
                    <button type="button" class="btn btn-primary" id="button-update">Actualizar</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/updateuser.js"></script>
</body>
</html>
