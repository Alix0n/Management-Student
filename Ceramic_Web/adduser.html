<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar Usuario</title>
    <link rel="stylesheet" href="./css/adduser.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
</head> 
<body>
    <div class="card add">
        <div class="card-body">
            <h5 class="card-title">Agregar Usuario</h5>
            <div class="form-group mt-4">
                <label for="input-cod">Usuario</label>
                <input type="text" class="form-control" id="input-cod">
            </div>
            <div class="form-group mt-4">
                <label for="input-password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="input-password">
            </div>
            
            <div class="form-group mt-3">
                <button type="button" class="btn btn-primary" id="button-create">Añadir</button>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/adduser.js"></script>
</body>
</html>
